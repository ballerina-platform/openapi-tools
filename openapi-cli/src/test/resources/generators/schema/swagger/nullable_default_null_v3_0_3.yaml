openapi: 3.0.3
info:
  title: Nullable schemas with a null default value
  version: 1.0.0
paths:
  /holders:
    get:
      operationId: getHolder
      responses:
        "200":
          description: Holder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holder'
components:
  schemas:
    Tags:
      type: array
      nullable: true
      default: null
      items:
        type: string
    Labels:
      type: object
      nullable: true
      default: null
      additionalProperties:
        type: string
    Holder:
      type: object
      properties:
        tags:
          type: array
          nullable: true
          default: null
          items:
            type: string
        labels:
          $ref: '#/components/schemas/Labels'
        names:
          $ref: '#/components/schemas/Tags'
