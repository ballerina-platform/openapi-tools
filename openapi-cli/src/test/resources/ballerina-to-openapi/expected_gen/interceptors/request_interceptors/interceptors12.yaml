openapi: 3.0.1
info:
  title: PayloadV
  version: 0.0.0
servers:
  - url: "{server}:{port}/payloadV"
    variables:
      server:
        default: http://localhost
      port:
        default: "9090"
paths:
  /foo:
    get:
      operationId: getFoo
      responses:
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "401":
          description: Unauthorized
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FooResponse"
components:
  schemas:
    Bar:
      required:
        - message
      type: object
      properties:
        message:
          type: string
      additionalProperties: false
    ErrorPayload:
      required:
        - message
        - method
        - path
        - reason
        - status
        - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
    FooResponse:
      required:
        - bars
      type: object
      properties:
        bars:
          type: array
          items:
            $ref: "#/components/schemas/Bar"
      additionalProperties: false
